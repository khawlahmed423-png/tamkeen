async function api(path, method, body) {
  var GAS_URL = "https://script.google.com/macros/s/AKfycbyXcatqK3IedJdqLajjw4E7pSXo5qrqIvs9JuDi77NwekQe_e8fw-o50K_xLx97pz3c/exec?path=" + encodeURIComponent(path);

  if (TOK) o.headers["Authorization"] = "Bearer " + TOK;
  if (body !== undefined) {
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(body);
  }
  var r = await fetch(GAS_URL, o);
  var d = await r.json().catch(function() { return {}; });
  if (r.status === 401 && path !== "login" && TOK) { 
    endSession(); 
    draw(); 
    toast("انتهت الجلسة، سجّلي الدخول مرة أخرى"); 
  }
  if (!r.ok) { 
    var er = new Error(d.error || "error"); 
    er.status = r.status; 
    throw er; 
  }
  return d;
}

async function H(x){
  var str="tamkeen:"+x;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
      return Array.from(new Uint8Array(d)).map(function(v){return v.toString(16).padStart(2,"0")}).join("");
    }
  }catch(e){}
  var h1=0xdeadbeef^str.length,h2=0x41c6ce57^str.length;
  for(var i=0,ch;i<str.length;i++){
    ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0");
}

var LOCAL_DB="tamkeen_persistence_v1";
function openLocalDB(){
  return new Promise(function(resolve,reject){
    try{
      if(!window.indexedDB){reject(new Error("IndexedDB غير متاح"));return}
      var r=indexedDB.open(LOCAL_DB,1);
      r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("state"))r.result.createObjectStore("state")};
      r.onsuccess=function(){resolve(r.result)};
      r.onerror=function(){reject(r.error)};
      r.onblocked=function(){reject(new Error("blocked"))};
    }catch(err){reject(err)}
  });
}

async function addPdf(el){
  if(!gate()){el.value="";return}
  var L = Array.prototype.slice.call(el.files);
  el.value="";
  if(!L.length) return;
  toast("جارٍ الرفع إلى Google Drive ...");
  var t = mine();
  for(var k=0;k<L.length;k++){
    var f = L[k];
    if(!/\.pdf$/i.test(f.name) || f.size > 20*1048576) continue;
    var base64 = await new Promise(function(res){
      var r = new FileReader();
      r.onload = function(){ res(r.result.split(",")[1]) };
      r.readAsDataURL(f);
    });
    try{
      var resp = await fetch(DRIVE_URL, {
        method: "POST",
        body: JSON.stringify({
          filename: f.name,
          mimeType: f.type,
          data: base64,
          teacherName: t.name + " - " + t.grade + " شعبة " + t.sec
        }),
        headers: {"Content-Type":"text/plain;charset=utf-8"}
      });
      var result = await resp.json();
      if(result.result === "success"){
        var id = "f"+Date.now()+Math.floor(Math.random()*999)+k;
        sF({id:id,phone:me,track:cur,name:f.name,at:Date.now(),seen:false,rev:false,note:"",term:S.cfg.term||"",aid:result.id,url:result.url});
      }
    }catch(err){
      toast("فشل الرفع، تأكدي من الاتصال");
    }
  }
  toast("تم الحفظ في Google Drive ✓");
  draw();
}

  return '<button class="lk" onclick="back()">← رجوع</button><div class="card"><b>تسجيل دخول المعلمة</b><label>اختاري اسمك</label><select id="lpName">'+opts+'</select><label>كلمة السر</label><input id="lc" type="password" inputmode="numeric" dir="ltr" style="text-align:center;letter-spacing:6px"><div class="er">'+e(ERR)+'</div><button class="bg" style="margin-top:16px" onclick="loginGo()">دخول</button></div>';
}

 if(!/^\d+$/.test(c1)||c1.length<(p?6:4)){er(p?"٦ أرقام على الأقل":"٤ أرقام على الأقل");return}
 if(p&&c1==="123456"){er("اختاري رمزًا غير الرمز الأول");return}

 else{var t=T(CH.phone);if(t){t.ph=h;t.tmp=false;t.fg=false;sT(t)}CH=null;V=["home"];toast("تم حفظ الرمز ✓")}draw();window.scrollTo(0,0)}

// نقل الحسابات والملفات المحفوظة سابقًا (في الجهاز أو Google Drive) إلى قاعدة البيانات مرة واحدة
async function importLegacy(){
  try{if(localStorage.getItem("imported"))return}catch(x){}
  var t=[],f=[],cfg=null;
  function add(d){if(!d)return;(d.t||[]).forEach(function(x){if(x&&x.ph)t.push(x)});(d.f||[]).forEach(function(x){if(x)f.push(x)});if(!cfg&&d.cfg&&Object.keys(d.cfg).length)cfg=d.cfg}
  try{add(JSON.parse(localStorage.getItem("tamkeen_legacy")||"null"))}catch(x){}
  try{var r=await fetch(DRIVE_URL);add(await r.json())}catch(x){}
  if(t.length||f.length||cfg){var res=await api("import","POST",{t:t,f:f,cfg:cfg});if(res.teachers||res.files)await loadServer()}
  try{localStorage.setItem("imported","1")}catch(x){}
}
